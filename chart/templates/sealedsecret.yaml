{{- if .Values.sealedSecret.enabled }}
{{- if not .Values.sealedSecret.encryptedData }}
{{- fail "sealedSecret.encryptedData must contain kubeseal-generated values when sealedSecret.enabled is true" }}
{{- end }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "k8s-app.secretName" . }}
  labels:
    {{- include "k8s-app.labels" . | nindent 4 }}
  {{- with .Values.sealedSecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  encryptedData:
    {{- toYaml .Values.sealedSecret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ include "k8s-app.secretName" . }}
      labels:
        {{- include "k8s-app.labels" . | nindent 8 }}
    type: {{ .Values.sealedSecret.type }}
{{- end }}
