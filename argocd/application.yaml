apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-app-template
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Kenshin0011/k8s-app-template.git
    targetRevision: main
    path: chart
    helm:
      releaseName: my-app
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
